<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ncpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ncpGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="ncpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#ncpBg)" rx="16"/>
  <rect width="800" height="450" fill="url(#ncpGrid)" rx="16"/>

  <!-- Main Terminal / Platform Canvas Frame -->
  <rect x="70" y="45" width="660" height="360" rx="14" fill="rgba(15,23,42,0.92)" stroke="rgba(99,102,241,0.35)" stroke-width="1.8"/>

  <!-- Window Header -->
  <rect x="70" y="45" width="660" height="42" rx="14" fill="#1e293b"/>
  <!-- Window buttons -->
  <circle cx="98" cy="66" r="6" fill="#ef4444"/>
  <circle cx="118" cy="66" r="6" fill="#f59e0b"/>
  <circle cx="138" cy="66" r="6" fill="#10b981"/>
  <text x="400" y="71" fill="#94a3b8" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Network-Control-Plane v1.0.0-GA // Provider-Neutral Workload Networking</text>

  <!-- Node 1: Topology Canvas & IPAM -->
  <rect x="100" y="125" width="165" height="85" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="182" y="157" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">React 18 &amp; IPAM</text>
  <text x="182" y="179" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Interactive Graph Canvas</text>
  <text x="182" y="196" fill="#0284c7" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">CIDR Conflict Engine</text>

  <!-- Arrow 1 (Bidirectional / Sync) -->
  <path d="M 265 167 L 315 167" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="315,163 323,167 315,171" fill="#818cf8"/>
  <polygon points="273,163 265,167 273,171" fill="#818cf8"/>

  <!-- Node 2: FastAPI Core & Provider Engine -->
  <rect x="318" y="115" width="165" height="105" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="145" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle">FastAPI Gateway</text>
  <text x="400" y="167" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Multi-Provider Engine</text>
  <text x="400" y="186" fill="#818cf8" font-family="sans-serif" font-size="10" text-anchor="middle">Docker &#8226; Swarm &#8226; K8s CNI</text>
  <text x="400" y="204" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">AWS VPC &#8226; Azure &#8226; GCP</text>

  <!-- Arrow 2 -->
  <path d="M 483 167 L 533 167" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="533,163 541,167 533,171" fill="#10b981"/>

  <!-- Node 3: GitOps & Agentic AI -->
  <rect x="535" y="125" width="165" height="85" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="617" y="157" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">GitOps &amp; AI Engine</text>
  <text x="617" y="179" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Continuous Drift Sync</text>
  <text x="617" y="196" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Governed AI Diagnostics</text>

  <!-- Lower Metric / Capabilities Grid -->
  <rect x="100" y="255" width="165" height="95" rx="10" fill="rgba(30,41,59,0.75)" stroke="rgba(255,255,255,0.08)"/>
  <text x="182" y="292" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" text-anchor="middle">v1.0.0-GA</text>
  <text x="182" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Production Ready</text>
  <text x="182" y="338" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Apache-2.0 Open Source</text>

  <rect x="318" y="255" width="165" height="95" rx="10" fill="rgba(30,41,59,0.75)" stroke="rgba(255,255,255,0.08)"/>
  <text x="400" y="292" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" text-anchor="middle">Zero Drift</text>
  <text x="400" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">GitOps Reconciliation</text>
  <text x="400" y="338" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Redis &#8226; ARQ Async Queue</text>

  <rect x="535" y="255" width="165" height="95" rx="10" fill="rgba(30,41,59,0.75)" stroke="rgba(255,255,255,0.08)"/>
  <text x="617" y="292" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" text-anchor="middle">Zero Trust</text>
  <text x="617" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Vault &amp; Okta SSO</text>
  <text x="617" y="338" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Dynamic Secret URIs</text>
</svg>

